name: Publish daily news and notify WeChat
on:
  push:
    branches: [main]
    paths: ['digests/*.json']
  workflow_dispatch:
    inputs:
      send_wechat:
        description: Send WeChat notification after publishing (check phone before retrying)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-news-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python render.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified report
        id: deployment
        uses: actions/deploy-pages@v4
  notify:
    needs: publish
    if: vars.WECHAT_ENABLED == 'true' && ((github.event_name == 'push' && github.run_attempt == 1) || (github.event_name == 'workflow_dispatch' && inputs.send_wechat))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send one notification
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_OPEN_ID: ${{ secrets.WECHAT_OPEN_ID }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          PAGES_URL: ${{ needs.publish.outputs.page_url }}
        run: python notify.py
